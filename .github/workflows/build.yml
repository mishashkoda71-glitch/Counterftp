name: Build Counterftp APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.2.1.stable ~/.local/share/godot/export_templates/ || true

      - name: Create Export Preset
        run: |
          echo '[preset.0]

          name="Android"
          platform="Android"
          runnable=true
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Counterftp.apk"
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          gradle_build/min_sdk="24"
          gradle_build/target_sdk="33"
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          version/code=1
          version/name="1.0"
          package/unique_name="com.example.counterftp"
          package/name="Counterftp"
          package/signed=true
          ' > export_presets.cfg

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/Counterftp.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Counterftp-APK
          path: build/*.apk
