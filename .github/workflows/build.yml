name: Build Counterftp APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          if [ -d "/root/.local/share/godot/export_templates/4.2.1.stable" ]; then
            mv /root/.local/share/godot/export_templates/4.2.1.stable ~/.local/share/godot/export_templates/;
          fi

      - name: Import Project (Generate .godot folder)
        run: |
          godot --headless --editor --quit

      - name: Install Android Build Template
        run: |
          godot --headless --install-android-build-template

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Create Export Preset
        run: |
          echo '[preset.0]

          name="Android"
          platform="Android"
          runnable=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Counterftp.apk"
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          version/code=1
          version/name="1.0"
          package/unique_name="com.misha.counterftp"
          package/name="Counterftp"
          package/signed=true
          ' > export_presets.cfg

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/Counterftp.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Counterftp-APK
          path: build/*.apk
